name: CI/CD - Cotacao Service

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'cotacao-service/**'
      - '.github/workflows/ci-cd-cotacao.yml'

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cotacao-service

    steps:
      - name: 1. Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. Instalar dependências e rodar Testes 
        run: |
          pip install -r requirements.txt
          pytest --cov=app --cov-report=xml

      - name: 4. Análise no SonarCloud (CI)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: cotacao-service
          args: >
            -Dsonar.projectKey=HenriqueKnaul_itineris
            -Dsonar.organization=henriqueknaul
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: 5. Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 6. Build e Push da Imagem Docker (Containerização + SemVer)
        run: |
          VERSION="1.0.${{ github.run_number }}"
          IMAGE="${{ secrets.DOCKER_USERNAME }}/itineris-cotacao"
          
          docker build -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

      - name: 7. Deploy Automático para DEV (branch develop)
        if: github.ref == 'refs/heads/develop'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV }}"

      - name: 8. Deploy Automático para HOMOL (branch main)
        if: github.ref == 'refs/heads/main'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_HOMOL }}"
