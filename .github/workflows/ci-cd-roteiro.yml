name: CI/CD - Roteiro Service

on:
  push:
    branches:
      - "feature/**"
      - "develop"
      - "main"
    paths:
      - "roteiro-service/**"
      - ".github/workflows/ci-cd-roteiro.yml"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      #Preparação do ambiente
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements.txt
        working-directory: ./roteiro-service

      #executar testes e gerar cobertura
      - name: Executar testes e gerar cobertura
        run: pytest --cov=app --cov-report=xml:coverage.xml
        working-directory: ./roteiro-service

      #SONAR preciso da permissao do Henrique para habilitar o sonarcloud, por enquanto deixei comentado
     # - name: Analisar código no SonarCloud
     #   uses: SonarSource/sonarqube-scan-action@v8.3.0
     #   env:
     #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
     #   with:
     #     projectBaseDir: roteiro-service
          
      #DOCKER
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem Docker
        run: |
          docker build -t darkeyde/roteiro-service:latest ./roteiro-service
          docker push darkeyde/roteiro-service:latest