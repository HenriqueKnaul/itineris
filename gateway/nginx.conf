# API Gateway do Itineris = Nginx funcionando como proxy reverso.
# O cliente sempre fala com a porta 8000; o Nginx olha o começo da URL
# e encaminha para o microsserviço certo.

server {
    listen 80;

    # Mantém o Host original (senão os redirects apontariam para o nome interno do container)
    proxy_set_header Host $http_host;

    # ------------------------------------------------------------------
    # Rotas PÚBLICAS (sem token)
    # ------------------------------------------------------------------
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # Saúde de cada serviço, passando pelo gateway
    location = /health/auth    { proxy_pass http://auth-service:8001/health; }
    location = /health/roteiro { proxy_pass http://roteiro-service:8002/health; }
    location = /health/cotacao { proxy_pass http://cotacao-service:8003/health; }

    # Login (e a validação de token, que o próprio Nginx usa abaixo)
    location /auth/ {
        proxy_pass http://auth-service:8001;
    }

    # ------------------------------------------------------------------
    # Rotas PROTEGIDAS: só passam com um token JWT válido
    # (auth_request = "antes de encaminhar, pergunta pro auth-service se o token é válido")
    # ------------------------------------------------------------------
    location /roteiros {
        auth_request /validar_token;
        proxy_pass http://roteiro-service:8002;
    }

    location /destinos {
        auth_request /validar_token;
        proxy_pass http://roteiro-service:8002;
    }

    location /cotacoes {
        auth_request /validar_token;
        proxy_pass http://cotacao-service:8003;
    }

    location /orcamentos {
        auth_request /validar_token;
        proxy_pass http://cotacao-service:8003;
    }

    # Rota interna (o cliente não acessa): repassa o header Authorization ao auth-service
    location = /validar_token {
        internal;
        proxy_pass http://auth-service:8001/auth/validar;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ------------------------------------------------------------------
    # Qualquer outra URL e respostas de erro (em JSON)
    # ------------------------------------------------------------------
    location / {
        default_type application/json;
        return 404 '{"erro":"rota_nao_mapeada","rotas_disponiveis":["/auth","/roteiros","/destinos","/cotacoes","/orcamentos"]}';
    }

    error_page 401 = @nao_autenticado;
    error_page 502 503 504 = @servico_indisponivel;

    location @nao_autenticado {
        default_type application/json;
        return 401 '{"erro":"nao_autenticado","mensagem":"Faça login em /auth/login e envie o header Authorization: Bearer <token>."}';
    }

    location @servico_indisponivel {
        default_type application/json;
        return 503 '{"erro":"servico_indisponivel","mensagem":"O microsserviço não está no ar."}';
    }
}
