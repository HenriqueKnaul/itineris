services:
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - roteiro-service
      - cotacao-service
      - auth-service

  roteiro-service:
    build: ./roteiro-service
    container_name: roteiro-service

    ports:
      - "8002:8002"
    volumes:
      - ./roteiro-service:/app
    environment:
      COTACAO_SERVICE_URL: http://cotacao-service:8003
      PYTHONUNBUFFERED: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  cotacao-service:
    build: ./cotacao-service
    container_name: cotacao-service
    ports:
      - "8003:8003"
    volumes:
      - ./cotacao-service:/app
    environment:
      PYTHONUNBUFFERED: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8001:8001"
    volumes:
      - ./auth-service:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-chave-padrao-apenas-para-desenvolvimento-trocar-em-producao}
      PYTHONUNBUFFERED: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  prometheus:
    image: prom/prometheus:latest
    container_name: itineris-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - cotacao-service

  grafana:
    image: grafana/grafana:latest
    container_name: itineris-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus