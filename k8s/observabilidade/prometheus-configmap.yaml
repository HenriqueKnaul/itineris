apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "cotacao-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["cotacao-service:8003"]

      - job_name: "auth-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["auth-service:8001"]

      - job_name: "roteiro-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["roteiro-service:8002"]